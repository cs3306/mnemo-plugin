name: docker

# Build and push the image to Docker Hub on pushes to main, version tags (v0.1.0), or manually.
#   cs3306/mnemo-plugin:latest        full: Word / PowerPoint / Excel / PDF / LaTeX / images
#   cs3306/mnemo-plugin:latest-slim   no TeX: Word / PowerPoint / Excel / images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tex: "1", suffix: "" }
          - { tex: "0", suffix: "-slim" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mnemo-plugin
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: WITH_TEX=${{ matrix.tex }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.tex }}
          cache-to: type=gha,scope=${{ matrix.tex }},mode=max
