[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-plugin"
version = "0.1.0"
description = "Tool plugin server for mnemo: Word / PowerPoint / Excel / PDF / LaTeX / image generation over a small HTTP protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mnemo-plugin = "mnemo_plugin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
